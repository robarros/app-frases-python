---
kind: "DatadogAgent"
apiVersion: "datadoghq.com/v2alpha1"
metadata:
  name: "datadog"
  namespace: "datadog"
spec:
  global:
    clusterName: "k0s-cluster"
    site: "us5.datadoghq.com"
    credentials:
      apiSecret:
        secretName: "datadog-secret"
        keyName: "api-key"
    tags:
      - "env:dev"
  features:
    clusterChecks:
      enabled: true
    orchestratorExplorer:
      enabled: true
    admissionController:
      enabled: true
      mutateUnlabelled: false
    logCollection:
      enabled: true
      containerCollectAll: false
    apm:
      enabled: true
      instrumentation:
        enabled: true
        targets:
          - name: "default-target"
            ddTraceVersions:
              java: "1"
              python: "4"
              js: "5"
              php: "1"
              dotnet: "3"
              ruby: "2"
    # otlp:
    #   receiver:
    #     protocols:
    #       grpc:
    #         enabled: true
    #         endpoint: "0.0.0.0:4317"
    #       http:
    #         enabled: true
    #         endpoint: "0.0.0.0:4318"
    usm:
      enabled: true
    prometheusScrape:
      enabled: true
      enableServiceEndpoints: true
  override:  # for k0s, to allow the agent to run with the default seccomp profile
    nodeAgent:
      volumes:
        - name: seccomp-root
          hostPath:
            path: /var/lib/k0s/kubelet/seccomp
      extraConfd:
        configDataMap:
          istio.yaml: |-
            ad_identifiers:
              - istio-proxy
              - proxyv2
              - proxyv2-rhel8
            init_config:
            instances:
              - use_openmetrics: true
                openmetrics_endpoint: http://%%host%%:15090/stats/prometheus
                namespace: "istio"
                metrics:
                  - istio_.*
                  - envoy_.*
                  - pilot_.*
                send_distribution_buckets: true
                send_distribution_counts_as_monotonic: true
                send_histograms_buckets: true
                send_monotonic_counter: true
                timeout: 30
                tag_by_endpoint: false
    clusterAgent:
      extraConfd:
        configDataMap:
          istio.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - use_openmetrics: true
                openmetrics_endpoint: http://istiod.istio-system.svc.cluster.local:15014/metrics
                namespace: "istio"
                metrics:
                  - pilot_.*
                  - galley_.*
                  - citadel_.*
                  - mixer_.*
                send_distribution_buckets: true
                send_distribution_counts_as_monotonic: true
                send_histograms_buckets: true
                timeout: 30
      


# helm repo add datadog https://helm.datadoghq.com
# helm upgrade --install datadog-operator datadog/datadog-operator -n datadog --create-namespace
# kubectl create secret generic datadog-secret --from-literal api-key=REDACTED -n datadog
# kubectl apply -f ./k8s/datadog.yaml
