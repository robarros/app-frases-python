services:
  # Datadog Agent para receber traces, logs e métricas
  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: datadog-agent
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=datadoghq.com
      - DD_APM_ENABLED=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
    ports:
      - "8126:8126" # APM traces
      - "8125:8125" # StatsD
      - "5000:5000" # IPC Unix socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

  api-front:
    build: ./api-front
    container_name: api-front
    ports:
      - "8080:8080"
    environment:
      # Configuração do Datadog
      - DD_AGENT_HOST=datadog-agent
      - DD_AGENT_PORT=8126
      - DD_SERVICE=api-front
      - DD_ENV=dev
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_TRACE_SAMPLE_RATE=1
      - DD_PROFILING_ENABLED=false
      - DD_RUNTIME_METRICS_ENABLED=true
      # Variáveis da aplicação
      - SERVICE2_URL=http://backend:8080/frases
    depends_on:
      - backend
      - datadog-agent

  backend:
    build: ./backend
    container_name: backend
    environment:
      # Configuração do Datadog
      - DD_AGENT_HOST=datadog-agent
      - DD_AGENT_PORT=8126
      - DD_SERVICE=backend
      - DD_ENV=dev
      - DD_VERSION=1.0.0
      - DD_LOGS_INJECTION=true
      - DD_TRACE_SAMPLE_RATE=1
      - DD_PROFILING_ENABLED=false
      - DD_RUNTIME_METRICS_ENABLED=true
    depends_on:
      - datadog-agent
